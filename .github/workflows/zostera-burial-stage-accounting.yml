name: Zostera original burial stage accounting
on:
  pull_request:
    paths:
      - 'analysis/155_zostera_seed_burial_source_gate.py'
      - 'analysis/157_zostera_burial_stage_accounting.py'
      - '.github/workflows/zostera-burial-stage-accounting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_burial:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl==3.1.5
      - run: |
          python analysis/155_zostera_seed_burial_source_gate.py
          mkdir -p out
          python analysis/157_zostera_burial_stage_accounting.py > out/burial_stage_accounting.json
          python - <<'PY'
          import json
          x=json.load(open("out/burial_stage_accounting.json"))
          a=x["audit"]
          assert a["pots"]==a["final_emergence_matches"]==100
          assert a["reported_total"]==1451 and a["pots_below_15"]==28 and a["pots_above_15"]==11
          d=x["large_minus_small_pooled_within_tank"]
          assert d["summed_differences"]=={"dead":-5,"emerged":5,"emerged_plus_viable":38,"failed":-31,"total":2,"viable":33}
          assert d["positive_tanks"]["viable"]==5
          e=x["unsorted_8cm_minus_1cm_by_harvest"]["24"]
          assert e["summed_differences"]=={"dead":21,"emerged":-40,"emerged_plus_viable":-29,"failed":8,"total":0,"viable":11}
          assert e["positive_tanks"]["dead"]==5 and e["positive_tanks"]["emerged_plus_viable"]==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: burial-stage-accounting
          path: out/burial_stage_accounting.json
          if-no-files-found: error
