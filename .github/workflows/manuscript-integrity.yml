name: Manuscript integrity

on:
  push:
    paths:
      - "manuscript/**"
      - "docs/ECOLOGICAL_MECHANISM_BOUNDARY_V1.md"
      - ".github/workflows/manuscript-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "manuscript/**"
      - "docs/ECOLOGICAL_MECHANISM_BOUNDARY_V1.md"
      - ".github/workflows/manuscript-integrity.yml"
  workflow_dispatch:

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild single-file manuscript
        run: python manuscript/build_manuscript.py --out manuscript/TAMPA_ECOLOGY_MANUSCRIPT_V1.md
      - name: Verify generated manuscript is current
        run: git diff --exit-code -- manuscript/TAMPA_ECOLOGY_MANUSCRIPT_V1.md
      - name: Audit high-risk wording
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          x=Path("manuscript/TAMPA_ECOLOGY_MANUSCRIPT_V1.md").read_text().lower()
          forbidden=[
              "[ref",
              "citation needed",
              "confirmed extinction",
              "confirmed recolonization",
          ]
          for token in forbidden:
              assert token not in x, token
          assert "post-hoc external ecological" in x
          assert "do not establish direct competitive replacement" in x
          assert "not demographic extinction" in x
          assert "target year 2016" in x
          assert "mechanism" in x and "unresolved" in x
          assert "# references" in x
          refs=Path("manuscript/TAMPA_ECOLOGY_REFERENCES_V1.md").read_text().lower()
          required_refs=[
              "ellison", "orth", "waycott", "roca", "lefcheck",
              "unsworth", "lee", "carlson", "beck", "rising", "williams",
          ]
          for key in required_refs:
              assert key in refs, f"missing bibliography key: {key}"
          for key in ["ellison","orth","waycott","roca","lefcheck","unsworth","lee","carlson","beck","rising","williams"]:
              assert key in x, f"missing in-text citation key: {key}"
          print("manuscript claim-boundary and bibliography audit: OK")
          PYCODE
      - name: Archive tracked reproduction inputs
        if: always()
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/tampa-manuscript-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/tampa-manuscript-source-commit.txt"
          sha256sum "$RUNNER_TEMP/tampa-manuscript-source.zip" > "$RUNNER_TEMP/tampa-manuscript-source-sha256.txt"
      - name: Preserve reproduction inputs even when integrity fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tampa-manuscript-reproduction-source
          path: |
            ${{ runner.temp }}/tampa-manuscript-source.zip
            ${{ runner.temp }}/tampa-manuscript-source-commit.txt
            ${{ runner.temp }}/tampa-manuscript-source-sha256.txt
          if-no-files-found: error
