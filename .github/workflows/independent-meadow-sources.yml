name: Independent meadow source acquisition
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths:
      - 'analysis/201_independent_meadow_sources.py'
      - '.github/workflows/independent-meadow-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/201_independent_meadow_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-meadow-sources
          path: independent_meadow_sources/
          if-no-files-found: error
          retention-days: 14
