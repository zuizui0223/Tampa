name: TNC anchor BB preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/61_tnc_anchor_bb_preflight.py"
      - ".github/workflows/tnc-anchor-bb-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Audit quantitative anchor-level baseline feasibility
        run: python analysis/61_tnc_anchor_bb_preflight.py --out results/generated_tnc_anchor_bb/tnc_anchor_bb_preflight_v1.json
      - name: Show result
        run: cat results/generated_tnc_anchor_bb/tnc_anchor_bb_preflight_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: tnc-anchor-bb-preflight
          path: results/generated_tnc_anchor_bb/tnc_anchor_bb_preflight_v1.json
          if-no-files-found: error
