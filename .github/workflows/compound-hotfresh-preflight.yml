name: Published compound hot-fresh condition test

on:
  push:
    branches: [analysis/compound-hotfresh-v1]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/27_compound_hotfresh_preflight.R"
      - "analysis/28_compound_hotfresh_preflight_summary.py"
      - "analysis/29_compound_hotfresh_condition.py"
      - "results/compound_hotfresh_v1_contract.json"
      - "results/compound_hotfresh_preflight_v1.json"
      - "results/compound_hotfresh_condition_v1_contract.json"
      - "results/compound_hotfresh_condition_v1.json"
      - "results/current_validation_v2.json"
      - "docs/EOG_ECOLOGICAL_HYPOTHESES_V1.md"
      - "docs/ECOLOGICAL_MECHANISM_BOUNDARY_V1.md"
      - "validation/verify_compound_hotfresh_condition.py"
      - "README.md"
      - ".github/workflows/compound-hotfresh-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/27_compound_hotfresh_preflight.R"
      - "analysis/28_compound_hotfresh_preflight_summary.py"
      - "analysis/29_compound_hotfresh_condition.py"
      - "results/compound_hotfresh_v1_contract.json"
      - "results/compound_hotfresh_preflight_v1.json"
      - "results/compound_hotfresh_condition_v1_contract.json"
      - "results/compound_hotfresh_condition_v1.json"
      - "results/current_validation_v2.json"
      - "docs/EOG_ECOLOGICAL_HYPOTHESES_V1.md"
      - "docs/ECOLOGICAL_MECHANISM_BOUNDARY_V1.md"
      - "validation/verify_compound_hotfresh_condition.py"
      - "README.md"
      - ".github/workflows/compound-hotfresh-preflight.yml"
  workflow_dispatch:

jobs:
  compound:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download pinned published exposure artifact
        run: |
          mkdir -p results/generated_compound_hotfresh
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/tbep-tech/temp-manu/e5aaec93c7501fc38c63b615a89e68636b36421f/data/thralltrndat.RData \
            -o results/generated_compound_hotfresh/thralltrndat.RData
          test "$(git hash-object results/generated_compound_hotfresh/thralltrndat.RData)" = "f6518ea25685369057bfe92e71973ec04c57eac1"
      - name: Extract published 30C/25ppt stress runs
        run: Rscript analysis/27_compound_hotfresh_preflight.R results/generated_compound_hotfresh/thralltrndat.RData results/generated_compound_hotfresh/compound_hotfresh_segment_year.csv
      - name: Summarize response-independent coverage
        run: python analysis/28_compound_hotfresh_preflight_summary.py --segment results/generated_compound_hotfresh/compound_hotfresh_segment_year.csv --station results/generated_compound_hotfresh/compound_hotfresh_segment_year_station.csv --out results/generated_compound_hotfresh/compound_hotfresh_preflight_v1.json
      - name: Enforce response gate
        run: python -c "import json; x=json.load(open('results/generated_compound_hotfresh/compound_hotfresh_preflight_v1.json')); assert x['status']=='preflight_pass', x"
      - name: Rebuild Tampa focal responses only after exposure gate
        run: python analysis/03_quantitative_state.py --out results/generated_compound_hotfresh
      - name: Test joint hot-fresh stress beyond marginal hot/fresh stress
        run: python analysis/29_compound_hotfresh_condition.py --input results/generated_compound_hotfresh --out results/generated_compound_hotfresh
      - name: Verify canonical compound result
        run: python validation/verify_compound_hotfresh_condition.py --generated results/generated_compound_hotfresh/compound_hotfresh_condition_v1.json --canonical results/compound_hotfresh_condition_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-compound-hotfresh-v1
          path: results/generated_compound_hotfresh/
