name: Northeast SeagrassNet Gate0 metadata only

on:
  push:
    branches:
      - validation/ne-seagrassnet-memory-v1
    paths:
      - "validation/ne_seagrassnet_memory_v1/**"
      - ".github/workflows/ne-seagrassnet-gate0.yml"
  workflow_dispatch:

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dryad metadata only
        run: python validation/ne_seagrassnet_memory_v1/gate0_metadata.py
      - name: Assert response unopened
        run: |
          python - <<'PY'
          import json
          x=json.load(open("validation/ne_seagrassnet_memory_v1/gate0_metadata_result.json"))
          assert x["response_file_gets"]==0
          assert x["response_bytes_opened"]==0
          assert x["response_values_opened"] is False
          print(x["status"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ne-seagrassnet-gate0
          path: validation/ne_seagrassnet_memory_v1/gate0_metadata_result.json
