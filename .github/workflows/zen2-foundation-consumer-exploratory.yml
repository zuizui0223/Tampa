name: Tampa ZEN2 foundation–consumer reciprocity exploratory source
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'analysis/126_zen2_structure_consumer_source_preflight.py'
      - 'analysis/127_zen2_2015_site_predation_factorial.py'
      - 'analysis/128_zen2_2014_50meadow_state_consumer.py'
      - 'analysis/129_zen2_predation_manipulation_ceiling_audit.py'
      - 'validation/test_zen2_predation_manipulation_ceiling_audit.py'
      - 'validation/test_zen2_2014_50meadow_state_consumer.py'
      - 'validation/test_zen2_2015_site_predation_factorial.py'
      - 'validation/test_zen2_structure_consumer_source_preflight.py'
      - 'docs/ZEN2_FOUNDATION_CONSUMER_EXPERIMENT_20261124.md'
      - 'results/zen2_2015_site_predation_source_verified_20261124.json'
      - 'results/zen2_2014_25region_state_consumer_source_verified_20261124.json'
      - '.github/workflows/zen2-foundation-consumer-exploratory.yml'
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original 2015 experimental and 2014 observational source boundaries
        run: python -m unittest discover -s validation -p 'test_zen2_structure_consumer_source_preflight.py' -v
      - name: Profile original two public datasets and their experimental units
        run: |
          python analysis/126_zen2_structure_consumer_source_preflight.py --out /tmp/zen2_two_sources_metadata_v1.json
          cat /tmp/zen2_two_sources_metadata_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: zen2-two-original-sources-metadata
          path: /tmp/zen2_two_sources_metadata_v1.json

  experiment_2015_site_equal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test experimental treatment factorial, status and site-level independence
        run: python -m unittest discover -s validation -p 'test_zen2_2015_site_predation_factorial.py' -v
      - name: Analyze 2015 original 17-site tether experiment by site
        run: |
          python analysis/127_zen2_2015_site_predation_factorial.py --out /tmp/zen2_2015_site_predation.json
          cat /tmp/zen2_2015_site_predation.json
      - name: Match ZEN2 2015 source-verification to pinned exact source-backed JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('/tmp/zen2_2015_site_predation.json').read_text())
          frozen=json.loads(Path('results/zen2_2015_site_predation_source_verified_20261124.json').read_text())
          proof=frozen.pop('source_verified_run',None)
          if not proof or proof.get('status')!='completed_success' or current!=frozen:
              raise SystemExit('ZEN2 derived results drift or provenance missing: results/zen2_2015_site_predation_source_verified_20261124.json')
          print('PASS source and full result identity: ZEN2 2015 source-verification')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zen2-2015-eelgrass-thinning-consumer-predation
          path: /tmp/zen2_2015_site_predation.json

  survey_2014_paired_structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test 25 region-code A/B measurement pairs and missingness
        run: python -m unittest discover -s validation -p 'test_zen2_2014_50meadow_state_consumer.py' -v
      - name: Calculate matched-within-region observed host/consumer/epiphyte co-variation
        run: |
          python analysis/128_zen2_2014_50meadow_state_consumer.py --out /tmp/zen2_2014_25region_state_consumer.json
          cat /tmp/zen2_2014_25region_state_consumer.json
      - name: Match ZEN2 2014 source-verification to pinned exact source-backed JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('/tmp/zen2_2014_25region_state_consumer.json').read_text())
          frozen=json.loads(Path('results/zen2_2014_25region_state_consumer_source_verified_20261124.json').read_text())
          proof=frozen.pop('source_verified_run',None)
          if not proof or proof.get('status')!='completed_success' or current!=frozen:
              raise SystemExit('ZEN2 derived results drift or provenance missing: results/zen2_2014_25region_state_consumer_source_verified_20261124.json')
          print('PASS source and full result identity: ZEN2 2014 source-verification')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zen2-2014-twentyfive-paired-region-state-consumer
          path: /tmp/zen2_2014_25region_state_consumer.json

  manipulation_dose_ceiling_size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic closure and taxon-confounding checks
        run: python -m unittest discover -s validation -p 'test_zen2_predation_manipulation_ceiling_audit.py' -v
      - name: Original ZEN2 2015 experimental dose, saturation and prey-size audit
        run: |
          python analysis/129_zen2_predation_manipulation_ceiling_audit.py \
            --out /tmp/zen2_2015_dose_ceiling_prey_size.json
          cat /tmp/zen2_2015_dose_ceiling_prey_size.json
      - uses: actions/upload-artifact@v4
        with:
          name: zen2-2015-manipulation-ceiling-size-source-audit
          path: /tmp/zen2_2015_dose_ceiling_prey_size.json
