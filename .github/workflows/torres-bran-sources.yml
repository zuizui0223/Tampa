name: Torres Strait BRAN daily surface currents
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths: ['analysis/210_torres_bran_sources.py', '.github/workflows/torres-bran-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install netCDF4 numpy
      - run: timeout 300 python analysis/210_torres_bran_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torres-bran-sources
          path: torres_bran_sources/
          retention-days: 14
