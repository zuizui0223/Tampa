name: Site-template-resistant TNC diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/71_dynamic_reserve_future_diagnostic.py"
      - "analysis/72_anchor_tnc_future_bb_diagnostic.py"
      - "field/dynamic_reserve_future_analysis_freeze.json"
      - "field/anchor_tnc_future_bb_analysis_freeze.json"
      - "validation/test_site_template_resistant_diagnostics.py"
      - "validation/test_anchor_tnc_rank_identifiability.py"
      - "analysis/82_tnc_anchor_triplet_fragility.py"
      - "results/tnc_anchor_triplet_fragility_v1.json"
      - "docs/TNC_ANCHOR_TRIPLET_ATTRITION_V1.md"
      - "docs/TAMPA_SPECIFIC_ECOLOGICAL_PRINCIPLE_V1.md"
      - "results/clonal_state_prospective_v2_contract.json"
      - "results/event_stress_debt_prospective_v1_contract.json"
      - ".github/workflows/site-template-resistant-diagnostics.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify response-free complete-triplet attrition scenarios
        run: |
          python analysis/82_tnc_anchor_triplet_fragility.py --self-test
          python analysis/82_tnc_anchor_triplet_fragility.py
          git diff --exit-code -- results/tnc_anchor_triplet_fragility_v1.json
      - run: python validation/test_anchor_tnc_rank_identifiability.py
      - run: python validation/test_site_template_resistant_diagnostics.py
