name: Lucinid tissue stage diagnostic
on:
  pull_request:
    paths:
      - 'analysis/160_paired_stage_mutualism_source_gate.py'
      - 'analysis/164_lucinid_tissue_stage_diagnostic.py'
      - '.github/workflows/lucinid-tissue-stage-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: numpy==2.2.6 pandas==2.2.3 openpyxl==3.1.5
      - run: |
          python - <<'PY'
          import importlib.util
          s=importlib.util.spec_from_file_location("source","analysis/160_paired_stage_mutualism_source_gate.py")
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m);m.ROOT.mkdir(exist_ok=True)
          assert m.figshare()["status"]=="ACQUIRED_SCHEMA_UNVERIFIED"
          assert m.dryad("lucinid_2020","10.5061/dryad.jm63xsj6n")["status"]=="SOURCE_ACQUIRED_SCHEMA_ONLY"
          PY
          mkdir -p out
          python analysis/164_lucinid_tissue_stage_diagnostic.py > out/lucinid_tissue_stage.json
          python - <<'PY'
          import json, math
          x=json.load(open("out/lucinid_tissue_stage.json"))
          c=x["chin2021"];f=x["van_der_geest2020"]
          assert c["host_units"]==48 and c["tanks"]==6 and c["missing_pctS"]==26
          assert c["dead_rhizomes_without_pctS"]==25
          assert sum(r["negative_tanks"][0] for r in c["contexts"].values())==24
          assert sum(r["negative_tanks"][1] for r in c["contexts"].values())==20
          assert sum(r["negative_tanks"][2] for r in c["contexts"].values())==19
          assert sum(r["positive_tanks"][3] for r in c["contexts"].values())==19
          assert len(c["paired_vectors"])==24
          expected={"rhizome_delta":[.08444484,.08473285,.08910442,.11949836,.12213251],"leaf_delta":[.36883108,.35325705,.37567544,.37456125,.37281785],"shoot_delta":[.39065227,.40090973,.42883297,.39484799,.41513644]}
          for endpoint,values in expected.items():
              for model,target in zip(("context_only","bulk_relief","bulk_relief_residual","tissue_relief","bulk_and_tissue"),values):
                  assert math.isclose(c["cv"][endpoint][model]["rmse"],target,abs_tol=1e-7)
          assert f["host_plots"]==24
          assert f["contexts"]["OM"]["positive_blocks"][1]==5
          assert f["contexts"]["OM"]["negative_blocks"][3]==5
          assert f["contexts"]["OM"]["negative_blocks"][5]==5
          assert math.isclose(f["contexts"]["OM"]["percent_change"][1],55.83241233798857,abs_tol=1e-8)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lucinid-tissue-stage-diagnostic
          path: out/
          if-no-files-found: error
