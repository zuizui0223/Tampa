name: Condition leads thinning ecology

on:
  push:
    branches: [analysis/condition-leads-thinning-v1]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/36_condition_leads_thinning.py"
      - "results/condition_leads_thinning_v1_contract.json"
      - ".github/workflows/condition-leads-thinning.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/36_condition_leads_thinning.py"
      - "results/condition_leads_thinning_v1_contract.json"
      - ".github/workflows/condition-leads-thinning.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild Tampa quantitative state
        run: python analysis/03_quantitative_state.py --out results/generated_condition_leads_thinning
      - name: Test condition-to-thinning cross-lag
        run: python analysis/36_condition_leads_thinning.py --input results/generated_condition_leads_thinning --out results/generated_condition_leads_thinning
      - name: Verify frozen endpoint registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open("results/generated_condition_leads_thinning/condition_leads_thinning_v1.json"))
          assert x["schema"]=="tampa.condition_leads_thinning_v1.result"
          assert x["registry"]["condition_eligible_consecutive_transitions"]>0
          assert x["registry"]["nodes"]>=10
          assert x["primary_frequency"]["scored_target_years"]>=10
          assert 2016 not in set(__import__("pandas").read_csv(
              "results/generated_condition_leads_thinning/condition_leads_thinning_frequency_primary_year_scores.csv"
          ).target_year.astype(int))
          for p in [
              "condition_leads_thinning_transitions.csv",
              "condition_leads_thinning_frequency_primary_year_scores.csv",
              "condition_leads_thinning_frequency_with2016_year_scores.csv",
              "condition_leads_thinning_bb_primary_year_scores.csv",
          ]:
              q=Path("results/generated_condition_leads_thinning")/p
              assert q.exists() and q.stat().st_size>100, q
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-condition-leads-thinning-v1
          path: results/generated_condition_leads_thinning/
