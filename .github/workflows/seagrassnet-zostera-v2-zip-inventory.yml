name: SeagrassNet Zostera v2 ZIP inventory

on:
  push:
    branches:
      - validation/seagrassnet-zostera-v2
    paths:
      - "validation/seagrassnet_zostera_v2/zip_inventory_contract.json"
      - "validation/seagrassnet_zostera_v2/zip_inventory.py"
      - ".github/workflows/seagrassnet-zostera-v2-zip-inventory.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce v1 candidate universe
        run: python validation/seagrassnet_zostera_v1/preflight.py
      - name: Reproduce body-free HEAD certificate
        run: python validation/seagrassnet_zostera_v2/head_gate.py
      - name: Verify frozen identities
        run: |
          python - <<'PY'
          import json
          p=json.load(open("validation/seagrassnet_zostera_v1/preflight_result.json"))
          h=json.load(open("validation/seagrassnet_zostera_v2/head_result.json"))
          assert p["fingerprint"]=="02f9582219d9b1afae58947b08a5502488f8c9d2ae75d2b06c9ef1fd6ca45ea0"
          assert h["fingerprint"]=="a681dbe4a49df2d8964523ec6a68722530e7879bb3572175eb04660c5a2ed2b1"
          PY
      - name: Read ZIP central directory only
        run: python validation/seagrassnet_zostera_v2/zip_inventory.py
      - name: Assert member payload remains unopened
        run: |
          python - <<'PY'
          import json
          x=json.load(open("validation/seagrassnet_zostera_v2/zip_inventory_result.json"))
          assert x["member_payload_requests"]==0
          assert x["member_payload_bytes_opened"]==0
          assert x["response_values_opened"] is False
          print(x["status"])
          PY
      - name: Upload ZIP inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seagrassnet-zostera-v2-zip-inventory
          path: |
            validation/seagrassnet_zostera_v1/preflight_result.json
            validation/seagrassnet_zostera_v2/head_result.json
            validation/seagrassnet_zostera_v2/zip_inventory_result.json
