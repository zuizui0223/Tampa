name: Diagnose NPS Tier2 duplicate semantics

on:
  push:
    branches:
      - analysis/nps-tier2-landscape-v1
    paths:
      - "analysis/nps_tier2_landscape_v1/diagnose_duplicate_semantics.py"
      - ".github/workflows/nps-tier2-duplicate-semantics.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/nps_tier2_landscape_v1/diagnose_duplicate_semantics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nps-tier2-duplicate-semantics
          path: analysis/nps_tier2_landscape_v1/duplicate_semantics_result.json
