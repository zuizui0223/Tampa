name: Focused Charlotte 2024 original background habitat replay

on:
  push:
    paths:
      - ".github/workflows/charlotte-2024-focused-source-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  focused-original-2024-classes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed source geometry dependencies
        run: python -m pip install --disable-pip-version-check "shapely==2.1.2" "pyproj==3.7.2"
      - name: Check previous original 2016-2022-2024 input archive SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14494425181" --jq .digest)"
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14494425181" --jq .workflow_run.id)"
          test "$SHA" = "sha256:fb22443b6d0b8bf1a86cf82670342adf18c6d76971074b65f7cbafbfe9db1bea"
          test "$ID" = "44446913647"
      - uses: actions/download-artifact@v4
        with:
          name: charlotte-2016-positive-three-date-overlay
          run-id: 44446913647
          github-token: ${{ github.token }}
          path: results/archived_source
      - name: Verify source-locked source map class and geometric tests
        run: python -m unittest discover -s validation -p 'test_charlotte_2024_original_classes_in_giant_unknown.py' -v
      - name: Run 2024 official district raw code overlay for 222-acres target
        run: |
          python analysis/126_charlotte_2024_original_classes_in_giant_unknown.py             --archive-root results/archived_source             --out results/generated_charlotte_original_2024_giant_all_class_unknown_v1.json
      - name: Preserve raw official source code spatial partition or STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charlotte2024-focused-original-classes-giant-unknown
          path: results/generated_charlotte_original_2024_giant_all_class_unknown_v1.json
          if-no-files-found: warn
          retention-days: 30
