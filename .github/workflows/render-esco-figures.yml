name: Render Estuaries and Coasts figures

on:
  push:
    branches: [manuscript/estuaries-coasts-v1]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/05_community_compensation.py"
      - "analysis/09_quantitative_early_warning.py"
      - "analysis/11_nps_persistent_cover.py"
      - "analysis/30_main_figure_data.py"
      - "analysis/31_nps_figure_data.py"
      - "figures/render_esco_figures.py"
      - ".github/workflows/render-esco-figures.yml"
      - "results/current_validation_v2.json"
      - "results/nps_persistent_cover_v1.json"
  pull_request:
    branches: [main]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/05_community_compensation.py"
      - "analysis/09_quantitative_early_warning.py"
      - "analysis/11_nps_persistent_cover.py"
      - "analysis/30_main_figure_data.py"
      - "analysis/31_nps_figure_data.py"
      - "figures/render_esco_figures.py"
      - ".github/workflows/render-esco-figures.yml"
      - "results/current_validation_v2.json"
      - "results/nps_persistent_cover_v1.json"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "matplotlib>=3.10,<4" "pillow>=11,<12"
      - name: Rebuild Tampa quantitative state
        run: python analysis/03_quantitative_state.py --out results/generated
      - name: Rebuild Tampa community state
        run: python analysis/05_community_compensation.py --out results/generated
      - name: Rebuild Tampa early-warning analysis
        run: python analysis/09_quantitative_early_warning.py --input results/generated --out results/generated
      - name: Build Tampa figure data
        run: python analysis/30_main_figure_data.py --input results/generated --out results/generated/figure_data
      - name: Rebuild NPS external panel
        run: python analysis/11_nps_persistent_cover.py --out results/generated_nps_figure
      - name: Build NPS sidecar
        run: python analysis/31_nps_figure_data.py --input results/generated_nps_figure --out results/generated_nps_figure/figure_data
      - name: Render ESCO submission figures
        run: python figures/render_esco_figures.py --primary results/generated/figure_data --nps results/generated_nps_figure/figure_data --out results/generated_esco_figures
      - name: Verify journal figure package
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("results/generated_esco_figures")
          for n in range(1,5):
              for ext in ("eps","tif"):
                  p=root/f"Fig{n}.{ext}"
                  assert p.exists() and p.stat().st_size>1000, (p, p.stat().st_size if p.exists() else None)
              qa=root/f"Fig{n}_QA.png"
              assert qa.exists() and qa.stat().st_size>1000
              with Image.open(root/f"Fig{n}.tif") as im:
                  assert im.info.get("dpi",(0,0))[0] >= 590, (n, im.info.get("dpi"))
          print("ESCO figure package: OK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-estuaries-coasts-figures-v1
          path: results/generated_esco_figures/
