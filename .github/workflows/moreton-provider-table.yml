name: Moreton provider-table reconciliation and composition
on:
  push:
    branches: [analysis/cross-region-meadow-identity-20261127]
    paths: ['analysis/228_moreton_provider_table.py', '.github/workflows/moreton-provider-table.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moreton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn
      - run: python analysis/228_moreton_provider_table.py
      - uses: actions/upload-artifact@v4
        with:
          name: moreton-provider-table
          path: moreton_audit/
          retention-days: 30
