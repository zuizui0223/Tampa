name: Epiphyte measurement-layer preflight

on:
  push:
    paths:
      - "analysis/56_epiphyte_measurement_layer_preflight.py"
      - ".github/workflows/epiphyte-measurement-layer-preflight.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit unused epiphyte layer without response access
        run: python analysis/56_epiphyte_measurement_layer_preflight.py
      - name: Verify canonical bounded result
        run: python validation/verify_epiphyte_layer.py
      - uses: actions/upload-artifact@v4
        with:
          name: epiphyte-measurement-layer-preflight
          path: results/generated_epiphyte_preflight/epiphyte_measurement_layer_preflight_v1.json
