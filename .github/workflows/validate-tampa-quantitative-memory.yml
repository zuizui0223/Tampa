name: Validate Tampa matched quantitative memory

on:
  push:
    branches:
      - main
      - analysis/tampa-quant-memory-v1
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/14_tampa_matched_quantitative_memory.py"
      - ".github/workflows/validate-tampa-quantitative-memory.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild Tampa quantitative annual state
        run: python analysis/03_quantitative_state.py --out results/generated_tampa_quant_memory
      - name: Test matched quantitative memory
        run: python analysis/14_tampa_matched_quantitative_memory.py --input results/generated_tampa_quant_memory --out results/generated_tampa_quant_memory
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tampa-matched-quantitative-memory-v1
          path: results/generated_tampa_quant_memory/
