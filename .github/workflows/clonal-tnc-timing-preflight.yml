name: Clonal TNC timing preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/58_clonal_tnc_timing_preflight.py"
      - "results/clonal_state_prospective_v1_contract.json"
      - "docs/CLONAL_STATE_SAMPLING_PROTOCOL_V1.md"
      - ".github/workflows/clonal-tnc-timing-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Audit historical timing feasibility
        run: python analysis/58_clonal_tnc_timing_preflight.py --out results/generated_clonal_timing_preflight/clonal_tnc_timing_feasibility_v1.json
      - name: Show result
        run: cat results/generated_clonal_timing_preflight/clonal_tnc_timing_feasibility_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: clonal-tnc-timing-preflight
          path: results/generated_clonal_timing_preflight/clonal_tnc_timing_feasibility_v1.json
          if-no-files-found: error
