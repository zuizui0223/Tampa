name: Lucinid paired endpoint pilot
on:
  pull_request:
    paths:
      - 'analysis/161_lucinid_paired_endpoint_pilot.py'
      - 'analysis/172_seagrass_structural_state_diagnostic.py'
      - 'analysis/160_paired_stage_mutualism_source_gate.py'
      - '.github/workflows/lucinid-paired-endpoint-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: numpy==2.2.6 pandas==2.2.3 openpyxl==3.1.5
      - run: |
          python - <<'PY'
          import importlib.util
          s=importlib.util.spec_from_file_location("source","analysis/160_paired_stage_mutualism_source_gate.py")
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m);m.ROOT.mkdir(exist_ok=True)
          assert m.zenodo()["status"]=="ACQUIRED_SCHEMA_UNVERIFIED"
          assert m.dryad("lucinid_2020","10.5061/dryad.jm63xsj6n")["status"]=="SOURCE_ACQUIRED_SCHEMA_ONLY"
          assert m.dans()["status"]=="ACQUIRED_SCHEMA_UNVERIFIED"
          assert m.dryad("donaher_2021","10.5061/dryad.9cnp5hqh7")["status"]=="SOURCE_ACQUIRED_SCHEMA_ONLY"
          PY
          mkdir -p out
          python analysis/161_lucinid_paired_endpoint_pilot.py > out/lucinid_paired_endpoint_pilot.json
          python - <<'PY'
          import json,math
          x=json.load(open("out/lucinid_paired_endpoint_pilot.json"))["studies"]
          assert sum(v["host_units"] for v in x.values())==84
          def check(actual,expected):
              assert all(math.isclose(a,b,abs_tol=1e-6) for a,b in zip(actual,expected))
          check(x["2012"]["contrasts"]["S"]["oriented_log_response_ratios"],[5.134016,.328743])
          y=x["2020"]["contrasts"]["OM"]
          check(y["oriented_log_response_ratios"],[.491320,-.263568])
          assert all(a>0 and b<0 for a,b in y["leave_one_block_out_log_ratios"])
          check(x["2022"]["contrasts"]["no|yes"]["equal_tank_mean_log_ratios"],[2.786986,.740867])
          check(x["2022"]["contrasts"]["yes|yes"]["equal_tank_mean_log_ratios"],[2.670855,.342902])
          PY
      - name: Verify structural state diagnostics
        run: |
          python analysis/172_seagrass_structural_state_diagnostic.py > out/structural_state.json
          python - <<'PY'
          import json,math
          x=json.load(open("out/structural_state.json"))
          f=x["field_2020"]; l=x["laboratory_2012"]; d=x["donaher_source_audit"]
          assert f["plots"]==24 and f["blocks"]==6 and l["host_columns"]==20
          a=f["contrasts"]["clam_addition"]["endpoints"]; b=f["contrasts"]["organic_matter"]["endpoints"]
          for r,k,target in [(a,"shoots",1.180648458),(a,"below_per_shoot",.780108394),(b,"rhizome",.709677617),(b,"rhizome_per_shoot",.792784782)]:
              assert math.isclose(r[k]["ratio"],target,abs_tol=1e-8)
          assert a["below_per_shoot"]["negative_blocks"]==6
          assert all(v["holm_11_p"]>=.05 for c in f["contrasts"].values() for v in c["endpoints"].values())
          assert math.isclose(l["sulfide_effect_by_clam"]["Z"]["leaf"],.507887136,abs_tol=1e-8)
          assert math.isclose(l["sulfide_effect_by_clam"]["ZL"]["below"],.948329197,abs_tol=1e-8)
          assert d["duplicate_belowground_values_in_both_species_rows"]==80
          assert d["by_2019_context"]["JULY|ZOSTERA"]["zero_density_positive_mass"]==5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lucinid-paired-endpoint-pilot
          path: out/
          if-no-files-found: error
