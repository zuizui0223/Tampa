name: Seagrass life-history common support
on:
  push:
    branches: [analysis/cross-region-meadow-identity-20261127]
    paths:
      - 'analysis/223_life_history_common_support.py'
      - '.github/workflows/seagrass-life-history-common-support.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Download pinned survey archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/zuizui0223/Tampa/actions/artifacts/15185560000/zip -o survey.zip
          echo '31d4831e2efa3552e58db32a70fefccf6dcad5049e2bed4f2ca09d984b547e06  survey.zip' | sha256sum -c -
      - run: python analysis/223_life_history_common_support.py survey.zip common-support.json
      - uses: actions/upload-artifact@v4
        with:
          name: life-history-common-support
          path: common-support.json
