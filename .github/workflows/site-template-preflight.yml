name: Site-template physical and ecological audit

on:
  push:
    branches: [analysis/site-template-components-v1]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/23_site_template_preflight.py"
      - "analysis/24_site_template_outcome.py"
      - "results/site_template_preflight_v1.json"
      - "results/site_template_outcome_v1_contract.json"
      - "results/site_template_outcome_v1.json"
      - "results/current_validation_v2.json"
      - "docs/EOG_ECOLOGICAL_HYPOTHESES_V1.md"
      - "validation/verify_site_template_outcome.py"
      - "README.md"
      - ".github/workflows/site-template-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/23_site_template_preflight.py"
      - "analysis/24_site_template_outcome.py"
      - "results/site_template_preflight_v1.json"
      - "results/site_template_outcome_v1_contract.json"
      - "results/site_template_outcome_v1.json"
      - "results/current_validation_v2.json"
      - "docs/EOG_ECOLOGICAL_HYPOTHESES_V1.md"
      - "validation/verify_site_template_outcome.py"
      - "README.md"
      - ".github/workflows/site-template-preflight.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Extract response-independent site template
        run: python analysis/23_site_template_preflight.py --out results/generated_site_template
      - name: Rebuild Tampa quantitative response panel
        run: python analysis/03_quantitative_state.py --out results/generated_site_template
      - name: Test measured site-template components
        run: python analysis/24_site_template_outcome.py --input results/generated_site_template --out results/generated_site_template
      - name: Verify canonical result
        run: python validation/verify_site_template_outcome.py --generated results/generated_site_template/site_template_outcome_v1.json --canonical results/site_template_outcome_v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-site-template-v1
          path: results/generated_site_template/
