name: Site-template physical preflight

on:
  push:
    branches: [analysis/site-template-components-v1]
    paths:
      - "analysis/23_site_template_preflight.py"
      - ".github/workflows/site-template-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python analysis/23_site_template_preflight.py --out results/generated_site_template
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-site-template-preflight-v1
          path: results/generated_site_template/
