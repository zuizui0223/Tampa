name: Torres Strait historic surface currents
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths: ['analysis/208_torres_hycom_sources.py', '.github/workflows/torres-hycom-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/208_torres_hycom_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torres-hycom-sources
          path: torres_hycom_sources/
          retention-days: 14
