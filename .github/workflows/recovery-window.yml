name: Exact-point recovery window ecology

on:
  push:
    branches: [analysis/recovery-window-v1]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/41_recovery_window.py"
      - "results/community_buffering_v1_contract.json"
      - "results/recovery_window_v1_contract.json"
      - ".github/workflows/recovery-window.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/41_recovery_window.py"
      - "results/recovery_window_v1_contract.json"
      - ".github/workflows/recovery-window.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Rebuild exact-point community states
        run: python analysis/33_community_buffering.py --out results/generated_recovery_window

      - name: Test 1-3 year recovery window
        run: python analysis/41_recovery_window.py --input results/generated_recovery_window --out results/generated_recovery_window

      - name: Verify frozen risk-set registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open("results/generated_recovery_window/recovery_window_v1.json"))
          assert x["schema"]=="tampa.recovery_window_v1.result"
          assert x["registry"]["loss_episodes"]>0
          assert x["registry"]["risk_rows"]>=150
          assert x["registry"]["nodes"]>=15
          assert all(int(x["registry"]["risk_rows_by_duration"].get(str(d),0))>=20 for d in (1,2,3))
          for p in [
              "recovery_window_episodes.csv",
              "recovery_window_risk_rows.csv",
              "recovery_window_hazards_by_duration.csv",
              "recovery_window_hazards_by_previous_vegetation.csv",
          ]:
              q=Path("results/generated_recovery_window")/p
              assert q.exists() and q.stat().st_size>100, q
          print(json.dumps(x,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-recovery-window-v1
          path: results/generated_recovery_window/
