name: TNC anchor BB four-bay preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/62_tnc_anchor_bb_four_bay_preflight.py"
      - ".github/workflows/tnc-anchor-bb-four-bay-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Audit quantitative anchor-level baseline feasibility
        run: python analysis/62_tnc_anchor_bb_four_bay_preflight.py --out results/generated_tnc_anchor_bb_four_bay/tnc_anchor_bb_four_bay_preflight_v1.json
      - name: Show result
        run: cat results/generated_tnc_anchor_bb_four_bay/tnc_anchor_bb_four_bay_preflight_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: tnc-anchor-bb-four-bay-preflight
          path: results/generated_tnc_anchor_bb_four_bay/tnc_anchor_bb_four_bay_preflight_v1.json
          if-no-files-found: error
