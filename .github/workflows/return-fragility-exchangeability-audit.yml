name: Tampa return-fragility exchangeability audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'analysis/111_return_fragility_exchangeability_audit.py'
      - 'validation/test_return_fragility_exchangeability_audit.py'
      - 'docs/RETURN_FRAGILITY_EXCHANGEABILITY_FIELD_GATE_20261124.md'
      - 'results/return_fragility_v1.json'
      - 'field/return_detection_pilot_raw_v1_template.csv'
      - 'validation/validate_return_detection_pilot_raw_v1.py'
      - 'validation/test_return_detection_pilot_raw_v1.py'
      - 'analysis/112_detection_revisit_dependence_sensitivity.py'
      - 'validation/test_detection_revisit_dependence_sensitivity.py'
      - 'docs/DETECTION_REVISIT_DEPENDENCE_SENSITIVITY_20261124.md'
      - '.github/workflows/return-fragility-exchangeability-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source ledger reconstruction and analytical bounds
        run: python -m unittest discover -s validation -p 'test_return_fragility_exchangeability_audit.py' -v
      - name: Build audit strictly from frozen aggregated result
        run: |
          python analysis/111_return_fragility_exchangeability_audit.py \
            --source results/return_fragility_v1.json \
            --out /tmp/tampa_return_exchangeability_v1.json
          cat /tmp/tampa_return_exchangeability_v1.json
      - name: Test optional detection pilot raw-record fail-closed semantics
        run: python -m unittest discover -s validation -p 'test_return_detection_pilot_raw_v1.py' -v
      - name: Test dependence and structural-zero effort math
        run: python -m unittest discover -s validation -p 'test_detection_revisit_dependence_sensitivity.py' -v
      - name: Generate response-free dependence-sensitivity table
        run: |
          python analysis/112_detection_revisit_dependence_sensitivity.py --out /tmp/tampa_detection_dependence_v1.json
          cat /tmp/tampa_detection_dependence_v1.json
      - name: Verify raw template remains empty and NOT field ready
        run: |
          python validation/validate_return_detection_pilot_raw_v1.py \
            --input field/return_detection_pilot_raw_v1_template.csv \
            --out /tmp/tampa_optional_detection_pilot_qc.json
          cat /tmp/tampa_optional_detection_pilot_qc.json
      - uses: actions/upload-artifact@v4
        with:
          name: tampa-return-history-exchangeability-audit
          path: |
            /tmp/tampa_return_exchangeability_v1.json
            /tmp/tampa_optional_detection_pilot_qc.json
            /tmp/tampa_detection_dependence_v1.json
