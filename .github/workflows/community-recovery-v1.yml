name: Test community continuity and Thalassia return

on:
  push:
    branches: [analysis/community-recovery-v1]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/35_community_recovery.py"
      - "results/community_buffering_v1_contract.json"
      - "results/community_recovery_v1_contract.json"
      - ".github/workflows/community-recovery-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/35_community_recovery.py"
      - "results/community_recovery_v1_contract.json"
      - ".github/workflows/community-recovery-v1.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild exact-point community states
        run: python analysis/33_community_buffering.py --out results/generated_community_recovery
      - name: Test frozen three-year recovery hypotheses
        run: python analysis/35_community_recovery.py --input results/generated_community_recovery --out results/generated_community_recovery
      - name: Verify frozen recovery population
        run: |
          python - <<'PY'
          import json
          x=json.load(open("results/generated_community_recovery/community_recovery_v1.json"))
          assert x["schema"]=="tampa.community_recovery_v1.result"
          assert x["registry"]["three_year_thalassia_loss_sequences"]>0
          assert x["registry"]["loss_year_vegetated"]>0
          assert x["registry"]["loss_year_bare"]>0
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-community-recovery-v1
          path: results/generated_community_recovery/
