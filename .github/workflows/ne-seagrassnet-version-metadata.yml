name: Northeast SeagrassNet version metadata

on:
  push:
    branches: [validation/ne-seagrassnet-memory-v1]
    paths:
      - "validation/ne_seagrassnet_memory_v1/gate0_metadata_result.json"
      - "validation/ne_seagrassnet_memory_v1/version_metadata_contract.json"
      - "validation/ne_seagrassnet_memory_v1/version_metadata.py"
      - ".github/workflows/ne-seagrassnet-version-metadata.yml"
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python validation/ne_seagrassnet_memory_v1/version_metadata.py
      - run: |
          python - <<'PY'
          import json
          x=json.load(open("validation/ne_seagrassnet_memory_v1/version_metadata_result.json"))
          assert x["response_file_gets"]==0 and x["response_bytes_opened"]==0 and x["response_values_opened"] is False
          print(x["status"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ne-seagrassnet-version-metadata
          path: validation/ne_seagrassnet_memory_v1/version_metadata_result.json
