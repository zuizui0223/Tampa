name: Seagrass trajectories and new independent sources
on:
  push:
    branches: [analysis/cross-region-meadow-identity-20261127]
    paths:
      - 'analysis/224_recorded_life_history_trajectories.py'
      - 'analysis/225_independent_seagrass_observation_sources.py'
      - '.github/workflows/seagrass-trajectories-new-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trajectories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned survey archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/zuizui0223/Tampa/actions/artifacts/15185560000/zip -o survey.zip
          echo '31d4831e2efa3552e58db32a70fefccf6dcad5049e2bed4f2ca09d984b547e06  survey.zip' | sha256sum -c -
      - run: python analysis/224_recorded_life_history_trajectories.py survey.zip trajectories.json
      - uses: actions/upload-artifact@v4
        with:
          name: seagrass-trajectories
          path: trajectories.json
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/225_independent_seagrass_observation_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: new-independent-seagrass-sources
          path: new_seagrass_sources/
          retention-days: 30
