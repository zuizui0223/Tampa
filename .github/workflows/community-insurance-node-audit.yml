name: Community insurance stable-node audit

on:
  push:
    branches: [main]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/34_community_insurance.py"
      - "analysis/76_community_insurance_node_audit.py"
      - "results/community_insurance_node_audit_v1_contract.json"
      - "results/community_insurance_node_audit_v1.json"
      - "validation/verify_community_insurance_node_audit.py"
      - ".github/workflows/community-insurance-node-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/34_community_insurance.py"
      - "analysis/76_community_insurance_node_audit.py"
      - "results/community_insurance_node_audit_v1_contract.json"
      - "results/community_insurance_node_audit_v1.json"
      - "validation/verify_community_insurance_node_audit.py"
      - ".github/workflows/community-insurance-node-audit.yml"
  workflow_dispatch:

jobs:
  node-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Rebuild exact-point community states
        run: python analysis/33_community_buffering.py --out results/generated_community_insurance_node_audit

      - name: Rebuild exact-point focal-loss transitions
        run: python analysis/34_community_insurance.py --input results/generated_community_insurance_node_audit --out results/generated_community_insurance_node_audit

      - name: Run stable-node binary audit
        run: python analysis/76_community_insurance_node_audit.py --input results/generated_community_insurance_node_audit --out results/generated_community_insurance_node_audit

      - name: Verify canonical audit
        run: python validation/verify_community_insurance_node_audit.py --generated results/generated_community_insurance_node_audit/community_insurance_node_audit_v1.json --canonical results/community_insurance_node_audit_v1.json

      - name: Verify fail-closed interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open("results/generated_community_insurance_node_audit/community_insurance_node_audit_v1.json"))
          assert x["status"]=="within_node_binary_community_insurance_not_supported"
          assert x["primary"]["supported"] is False
          assert x["registry"]["all_transitions"]==370
          assert x["registry"]["informative_nodes"]==18
          assert x["registry"]["informative_transitions"]==346
          lo,hi=x["primary"]["ci95"]
          assert lo <= 0 <= hi
          for name in [
              "community_insurance_node_audit_transitions.csv",
              "community_insurance_node_audit_nodes.csv",
              "community_insurance_node_audit_v1.json",
          ]:
              p=Path("results/generated_community_insurance_node_audit")/name
              assert p.exists() and p.stat().st_size>0, name
          print(json.dumps(x,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-community-insurance-node-audit-v1
          path: results/generated_community_insurance_node_audit/
