name: Dynamic neighborhood state ecology

on:
  push:
    branches: [analysis/dynamic-neighborhood-state-v1]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/21_dynamic_neighborhood_state.py"
      - "results/dynamic_neighborhood_state_v1_contract.json"
      - ".github/workflows/dynamic-neighborhood-state.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/03_quantitative_state.py"
      - "analysis/21_dynamic_neighborhood_state.py"
      - "results/dynamic_neighborhood_state_v1_contract.json"
      - ".github/workflows/dynamic-neighborhood-state.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild Tampa quantitative annual state
        run: python analysis/03_quantitative_state.py --out results/generated_dynamic_neighborhood
      - name: Test dynamic segment and neighborhood state
        run: python analysis/21_dynamic_neighborhood_state.py --input results/generated_dynamic_neighborhood --out results/generated_dynamic_neighborhood
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-dynamic-neighborhood-state-v1
          path: results/generated_dynamic_neighborhood/
