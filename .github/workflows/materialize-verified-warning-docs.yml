name: Materialize verified warning manuscript

on:
  push:
    branches: ["analysis/early-warning-monitoring-utility-v1-20261008"]
    paths:
      - ".github/warning-sync/payload-*.b64"
      - ".github/workflows/materialize-verified-warning-docs.yml"

permissions:
  contents: write

concurrency:
  group: tampa-verified-warning-manuscript-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'zuizui0223/Tampa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved source and extract exact reviewed payload
        run: |
          test "$(git rev-parse HEAD^)" = "27e73daf75815da27b733f7def89638800f065de"
          python - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          members = {
              'docs/EARLY_WARNING_MANUSCRIPT_SYNC_V1.md',
              'docs/superpowers/plans/2026-10-11-warning-reporting-sync.md',
              'manuscript/materializer_expected_files_v1.json',
              'manuscript/sync_verified_warning_v1.py',
              'validation/verify_warning_reporting_sync.py',
          }
          parts = [Path(f'.github/warning-sync/payload-{i}.b64') for i in (1,2,3)]
          raw = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'd815747509a250e1c7ae5fe312b2ceffb84745ddd25498b4f621aa5c712383f8'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
              entries = tf.getmembers()
              assert len(entries) == len(members) and {m.name for m in entries} == members
              for m in entries:
                  assert m.isfile() and not Path(m.name).is_absolute() and '..' not in Path(m.name).parts
                  target = Path(m.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(tf.extractfile(m).read())
          print('PASS: source parent and reviewed payload SHA256')
          PY
      - name: Synchronize canonical sections and rebuild using unchanged builders
        run: python manuscript/sync_verified_warning_v1.py
      - name: Independently verify reporting and exact output allowlist
        run: |
          python validation/verify_warning_reporting_sync.py
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest_path = 'manuscript/materializer_expected_files_v1.json'
          manifest = json.loads(Path(manifest_path).read_text())
          assert manifest['base_source_head'] == '27e73daf75815da27b733f7def89638800f065de'
          assert manifest['scientific_analysis_changes'] is False
          for name, expected in manifest['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          allowed = set(manifest['files']) | {manifest_path}
          tracked = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          assert tracked | untracked == allowed, (sorted((tracked | untracked)-allowed), sorted(allowed-(tracked | untracked)))
          for name in allowed:
              assert not name.startswith('analysis/') and not name.endswith('_contract.json')
          subprocess.run(['git','add','--',*sorted(allowed)], check=True)
          print('PASS: 53 reporting checks; all reviewed output hashes; analysis/contracts unchanged')
          PY
      - name: Commit only reviewed reporting files without merging or force-pushing
        env:
          TARGET_BRANCH: analysis/early-warning-monitoring-utility-v1-20261008
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize verified recorded-loss manuscript and supplement without changing models'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/reporting-integration-commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/tampa-warning-manuscript-synchronized.zip" HEAD manuscript docs/EARLY_WARNING_MANUSCRIPT_SYNC_V1.md docs/EARLY_WARNING_FIXED_MARK_VERIFIED_V1.md docs/EARLY_WARNING_MONITORING_UTILITY_V1.md results/warning_reporting_metrics_v1.json results/warning_reporting_sync_v1.json results/early_warning_fixed_mark_overlap_verified_v1.json validation/verify_warning_reporting_sync.py
      - name: Preserve verified manuscript bundle
        uses: actions/upload-artifact@v4
        with:
          name: tampa-warning-manuscript-synchronized
          path: |
            ${{ runner.temp }}/tampa-warning-manuscript-synchronized.zip
            ${{ runner.temp }}/reporting-integration-commit.txt
          if-no-files-found: error
