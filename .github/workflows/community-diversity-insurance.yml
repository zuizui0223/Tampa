name: Community diversity insurance ecology

on:
  push:
    branches: [analysis/community-diversity-insurance-v1]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/34_community_insurance.py"
      - "analysis/37_community_diversity_insurance.py"
      - "results/community_diversity_insurance_v1_contract.json"
      - ".github/workflows/community-diversity-insurance.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/34_community_insurance.py"
      - "analysis/37_community_diversity_insurance.py"
      - "results/community_diversity_insurance_v1_contract.json"
      - ".github/workflows/community-diversity-insurance.yml"
  workflow_dispatch:

jobs:
  diversity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild exact-point community-buffering states
        run: python analysis/33_community_buffering.py --out results/generated_diversity_insurance
      - name: Rebuild supported community-insurance transitions
        run: python analysis/34_community_insurance.py --input results/generated_diversity_insurance --out results/generated_diversity_insurance
      - name: Test community diversity-insurance gradient
        run: python analysis/37_community_diversity_insurance.py --input results/generated_diversity_insurance --out results/generated_diversity_insurance
      - name: Verify frozen endpoint registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open("results/generated_diversity_insurance/community_diversity_insurance_v1.json"))
          assert x["schema"]=="tampa.community_diversity_insurance_v1.result"
          assert x["contract"]=="results/community_diversity_insurance_v1_contract.json"
          assert x["registry"]["transitions"]>0
          assert x["registry"]["nodes"]>=20
          assert x["primary"]["distinct_richness_values"]>=1
          for name in [
            "community_diversity_insurance_transitions.csv",
            "community_diversity_insurance_by_richness.csv",
            "community_diversity_insurance_marginal_predictions.csv",
          ]:
              p=Path("results/generated_diversity_insurance")/name
              assert p.exists() and p.stat().st_size>0, name
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-community-diversity-insurance-v1
          path: results/generated_diversity_insurance/
