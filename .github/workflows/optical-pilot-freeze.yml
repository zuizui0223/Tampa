name: Optical pilot freeze schema

on:
  pull_request:
    branches: [main]
    paths:
      - "field/optical_pilot_freeze.json"
      - "results/optical_pilot_acceptance_v1_contract.json"
      - "validation/validate_optical_pilot_readiness.py"
      - ".github/workflows/optical-pilot-freeze.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit current fail-closed state
        run: python validation/validate_optical_pilot_readiness.py
