name: SeagrassNet Zostera v3 ZIP inventory

on:
  push:
    branches:
      - validation/seagrassnet-zostera-v3
    paths:
      - "validation/seagrassnet_zostera_v3/**"
      - ".github/workflows/seagrassnet-zostera-v3-zip-inventory.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce frozen v1 candidate universe
        run: python validation/seagrassnet_zostera_v1/preflight.py
      - name: Verify candidate universe
        run: |
          python - <<'PY'
          import json
          x=json.load(open("validation/seagrassnet_zostera_v1/preflight_result.json"))
          assert x["fingerprint"]=="02f9582219d9b1afae58947b08a5502488f8c9d2ae75d2b06c9ef1fd6ca45ea0"
          PY
      - name: Inventory ZIP without member payload access
        run: python validation/seagrassnet_zostera_v3/zip_inventory.py
      - name: Assert member payload remains unopened
        run: |
          python - <<'PY'
          import json
          x=json.load(open("validation/seagrassnet_zostera_v3/zip_inventory_result.json"))
          assert x["member_payload_requests"]==0
          assert x["member_payload_bytes_opened"]==0
          assert x["response_values_opened"] is False
          print(x["status"])
          PY
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seagrassnet-zostera-v3-zip-inventory
          path: |
            validation/seagrassnet_zostera_v1/preflight_result.json
            validation/seagrassnet_zostera_v3/zip_inventory_result.json
