name: Marine reproductive access sources
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths: ['analysis/183_marine_access_sources.py', '.github/workflows/marine-access-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/183_marine_access_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marine-access-sources
          path: marine_access_sources/
