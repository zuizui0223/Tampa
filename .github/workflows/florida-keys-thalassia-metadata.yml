name: Florida Keys seagrass metadata gate

on:
  push:
    branches:
      - validation/florida-keys-thalassia-v1
    paths:
      - "validation/florida_keys_thalassia_v1/**"
      - ".github/workflows/florida-keys-thalassia-metadata.yml"
  workflow_dispatch:

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata parser dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Run response-blind metadata gate
        run: python validation/florida_keys_thalassia_v1/metadata_gate.py
      - name: Assert biological data unopened
        run: |
          python - <<'PY'
          import json
          x=json.load(open("validation/florida_keys_thalassia_v1/metadata_result.json"))
          assert x["biological_data_downloads"] == 0
          assert x["biological_response_rows_opened"] == 0
          assert x["biological_response_values_opened"] is False
          print(x["status"])
          PY
      - name: Upload metadata result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: florida-keys-thalassia-metadata
          path: validation/florida_keys_thalassia_v1/metadata_result.json
