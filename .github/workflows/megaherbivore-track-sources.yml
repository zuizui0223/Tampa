name: Marine megaherbivore track and habitat sources
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths: ['analysis/206_megaherbivore_track_sources.py', '.github/workflows/megaherbivore-track-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/206_megaherbivore_track_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: megaherbivore-track-sources
          path: megaherbivore_track_sources/
          retention-days: 14
