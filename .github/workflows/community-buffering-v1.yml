name: Test community buffering ecology

on:
  push:
    branches: [analysis/community-buffering-v1]
    paths:
      - "analysis/33_community_buffering.py"
      - "results/community_buffering_v1_contract.json"
      - ".github/workflows/community-buffering-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/33_community_buffering.py"
      - "results/community_buffering_v1_contract.json"
      - ".github/workflows/community-buffering-v1.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run frozen community buffering analysis
        run: python analysis/33_community_buffering.py --out results/generated_community_buffering
      - name: Verify source and frozen endpoint
        run: |
          python - <<'PY'
          import json
          x=json.load(open("results/generated_community_buffering/community_buffering_v1.json"))
          assert x["schema"]=="tampa.community_buffering_v1.result"
          assert x["registry"]["eligible_visits"]==1497
          assert x["registry"]["stable_nodes"]==71
          assert x["registry"]["repeated_stable_points"]>0
          assert x["H1_transect_occupancy_buffering"]["primary_segment"]=="Lower Tampa Bay"
          h2=x["H2_exact_point_turnover"]
          assert h2["lower_events"]>=0 and h2["comparison_events"]>=0
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-community-buffering-v1
          path: results/generated_community_buffering/
