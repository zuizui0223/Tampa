  workflow_dispatch:

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python validation/verify_measurement_layer_hard_stop.py
      - run: python validation/verify_tnc_v2_authority.py
      - run: python validation/test_functional_insurance_loss_legacy_primary.py
