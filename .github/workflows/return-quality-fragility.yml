name: Return quality fragility ecology

on:
  push:
    branches: [analysis/return-quality-fragility-v1]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/43_recovery_debt.py"
      - "analysis/44_return_quality_fragility.py"
      - "results/recovery_debt_v1_contract.json"
      - "results/return_quality_fragility_v1_contract.json"
      - "results/return_quality_fragility_v1.json"
      - "validation/verify_return_quality_fragility.py"
      - ".github/workflows/return-quality-fragility.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/44_return_quality_fragility.py"
      - "results/return_quality_fragility_v1_contract.json"
      - "results/return_quality_fragility_v1.json"
      - "validation/verify_return_quality_fragility.py"
      - ".github/workflows/return-quality-fragility.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild exact-point presence states
        run: python analysis/33_community_buffering.py --out results/generated_return_quality_fragility
      - name: Rebuild exact-point quantitative return states
        run: python analysis/43_recovery_debt.py --input results/generated_return_quality_fragility --out results/generated_return_quality_fragility
      - name: Test return-quality fragility
        run: python analysis/44_return_quality_fragility.py --input results/generated_return_quality_fragility --out results/generated_return_quality_fragility
      - name: Verify canonical return-quality result
        run: python validation/verify_return_quality_fragility.py --generated results/generated_return_quality_fragility/return_quality_fragility_v1.json --canonical results/return_quality_fragility_v1.json

      - name: Verify frozen endpoint registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open("results/generated_return_quality_fragility/return_quality_fragility_v1.json"))
          assert x["schema"]=="tampa.return_quality_fragility_v1.result"
          assert x["registry"]["complete_recovered_four_year_sequences"]>=0
          assert x["registry"]["nodes"]>=0
          q=Path("results/generated_return_quality_fragility/return_quality_fragility_sequences.csv")
          assert q.exists()
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-return-quality-fragility-v1
          path: results/generated_return_quality_fragility/
