name: CHAP570 public station spatial coverage of giant algae unknown map cores

on:
  push:
    paths:
      - "analysis/122_chap570_public_station_giant_proximity.py"
      - "validation/test_chap570_public_station_giant_proximity.py"
      - ".github/workflows/chap570-giant-algae-monitoring-proximity.yml"
      - "results/charlotte_chap570_public_stations_source_verified_20261119.json"
      - "results/charlotte_giant_unmapped_interior_source_verified_20261119.json"
  pull_request:
    paths:
      - "analysis/122_chap570_public_station_giant_proximity.py"
      - "validation/test_chap570_public_station_giant_proximity.py"
      - ".github/workflows/chap570-giant-algae-monitoring-proximity.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matched-public-monitoring-registration-proximity:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned original-source GIS package versions
        run: python -m pip install --disable-pip-version-check "shapely==2.1.2" "pyproj==3.7.2"
      - name: Require previously verified public 2016-2022-2024 GIS original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14494425181" --jq .digest)"
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14494425181" --jq '.workflow_run.id')"
          test "$SHA" = "sha256:fb22443b6d0b8bf1a86cf82670342adf18c6d76971074b65f7cbafbfe9db1bea"
          test "$RUN" = "44446913647"
      - uses: actions/download-artifact@v4
        with:
          name: charlotte-2016-positive-three-date-overlay
          run-id: 44446913647
          github-token: ${{ github.token }}
          path: results/archived_source
      - name: Synthetic spatial count and 2024-visit-uncertainty guards
        run: python -m unittest discover -s validation -p 'test_chap570_public_station_giant_proximity.py' -v
      - name: Fetch public exact 63 CHAP registry points and compare to giant 2024 class-unknown interiors
        run: python analysis/122_chap570_public_station_giant_proximity.py --archive-root results/archived_source --out results/generated_chap570_public_station_giant_unknown_proximity_v1.json
      - name: Store public monitoring geography comparison or source STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chap570-public-registered-stations-to-giant-algae-map-unknown
          path: results/generated_chap570_public_station_giant_unknown_proximity_v1.json
          retention-days: 30
          if-no-files-found: warn
