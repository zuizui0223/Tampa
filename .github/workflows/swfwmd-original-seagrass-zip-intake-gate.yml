name: SWFWMD original authorized ZIP completeness and class code preflight

on:
  push:
    paths:
      - "analysis/119_swfmd_original_seagrass_zip_intake_gate.py"
      - "validation/test_swfmd_original_seagrass_zip_intake_gate.py"
      - ".github/workflows/swfwmd-original-seagrass-zip-intake-gate.yml"
  pull_request:
    paths:
      - "analysis/119_swfmd_original_seagrass_zip_intake_gate.py"
      - "validation/test_swfmd_original_seagrass_zip_intake_gate.py"
      - ".github/workflows/swfwmd-original-seagrass-zip-intake-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-source-archive-completeness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic dBase/shapefile reader
        run: python -m pip install --disable-pip-version-check "pyshp==2.3.1"
      - name: Synthetic complete, restricted, background, corrupt and GDB-only ZIP checks
        run: python -m unittest discover -s validation -p 'test_swfmd_original_seagrass_zip_intake_gate.py' -v
