name: Alaska eelgrass v2 metadata schema inventory

on:
  push:
    branches:
      - validation/alaska-eelgrass-v2
    paths:
      - "validation/alaska_eelgrass_v2/**"
      - ".github/workflows/alaska-eelgrass-v2-metadata.yml"
  workflow_dispatch:

jobs:
  metadata-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inventory official metadata only
        run: python validation/alaska_eelgrass_v2/metadata_schema.py
      - name: Assert response remains unopened
        run: |
          python - <<'PY'
          import json
          x=json.load(open("validation/alaska_eelgrass_v2/metadata_schema_result.json"))
          assert x["response_csv_gets"]==0
          assert x["response_csv_bytes_opened"]==0
          assert x["response_values_opened"] is False
          print(x["status"])
          PY
      - name: Upload metadata schema inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alaska-eelgrass-v2-metadata-schema
          path: validation/alaska_eelgrass_v2/metadata_schema_result.json
