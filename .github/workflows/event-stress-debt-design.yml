name: Event-scale stress-debt design

on:
  push:
    paths:
      - "results/event_stress_debt_prospective_v1_contract.json"
      - "docs/EVENT_SCALE_STRESS_DEBT_PROTOCOL_V1.md"
      - "docs/MECHANISM_COMPETING_HYPOTHESES_V1.md"
      - "docs/NEXT_MEASUREMENT_LAYER_PROGRAM_V1.md"
      - "validation/verify_event_stress_debt_design.py"
      - ".github/workflows/event-stress-debt-design.yml"
  pull_request:
    branches: [main]
    paths:
      - "results/event_stress_debt_prospective_v1_contract.json"
      - "docs/EVENT_SCALE_STRESS_DEBT_PROTOCOL_V1.md"
      - "docs/MECHANISM_COMPETING_HYPOTHESES_V1.md"
      - "docs/NEXT_MEASUREMENT_LAYER_PROGRAM_V1.md"
      - "validation/verify_event_stress_debt_design.py"
      - ".github/workflows/event-stress-debt-design.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python validation/verify_event_stress_debt_design.py
