name: Legacy recovery quality ecology

on:
  push:
    branches: [analysis/legacy-recovery-quality-v1]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/43_recovery_debt.py"
      - "analysis/45_legacy_recovery_quality.py"
      - "results/recovery_debt_v1_contract.json"
      - "results/legacy_recovery_quality_v1_contract.json"
      - ".github/workflows/legacy-recovery-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/45_legacy_recovery_quality.py"
      - "results/legacy_recovery_quality_v1_contract.json"
      - ".github/workflows/legacy-recovery-quality.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild exact-point presence states
        run: python analysis/33_community_buffering.py --out results/generated_legacy_recovery_quality
      - name: Rebuild exact-point quantitative states
        run: python analysis/43_recovery_debt.py --input results/generated_legacy_recovery_quality --out results/generated_legacy_recovery_quality
      - name: Test local legacy against recovery quality
        run: python analysis/45_legacy_recovery_quality.py --input results/generated_legacy_recovery_quality --out results/generated_legacy_recovery_quality
      - name: Verify frozen endpoint registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open("results/generated_legacy_recovery_quality/legacy_recovery_quality_v1.json"))
          assert x["schema"]=="tampa.legacy_recovery_quality_v1.result"
          assert x["registry"]["recovered_quantitative_sequences"]>=0
          assert x["registry"]["nodes"]>=0
          q=Path("results/generated_legacy_recovery_quality/legacy_recovery_quality_sequences.csv")
          assert q.exists()
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-legacy-recovery-quality-v1
          path: results/generated_legacy_recovery_quality/
