name: Ragworm public source retry
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths:
      - 'analysis/160_ragworm_public_retry.py'
      - 'analysis/160_sibes_example_extract.R'
      - '.github/workflows/ragworm-public-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/160_ragworm_public_retry.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: Rscript analysis/160_sibes_example_extract.R
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragworm-public-retry
          path: ragworm_retry/
          if-no-files-found: error
