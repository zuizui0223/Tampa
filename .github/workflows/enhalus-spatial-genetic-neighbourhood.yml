name: Enhalus spatial genetic neighbourhood
on:
  pull_request:
    paths:
      - 'analysis/138_reproductive_exact_source_members.py'
      - 'analysis/141_enhalus_spatial_genetic_neighbourhood.py'
      - 'docs/ENHALUS_SPATIAL_GENETIC_NEIGHBOURHOOD_20261124.md'
      - '.github/workflows/enhalus-spatial-genetic-neighbourhood.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install numpy==2.2.6 openpyxl==3.1.5
      - run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("acquire","analysis/138_reproductive_exact_source_members.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          version,members=mod.SOURCES["yu"]
          print(mod.extract("yu",version,members))
          PY
      - run: |
          mkdir -p out
          python analysis/141_enhalus_spatial_genetic_neighbourhood.py > out/enhalus_spatial_neighbourhood.json
      - uses: actions/upload-artifact@v4
        with:
          name: enhalus-spatial-neighbourhood
          path: out/enhalus_spatial_neighbourhood.json
          if-no-files-found: error
