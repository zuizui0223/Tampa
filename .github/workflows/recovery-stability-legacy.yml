name: Recovery stability legacy ecology

on:
  push:
    branches: [analysis/recovery-stability-legacy-v1]
    paths:
      - "analysis/33_community_buffering.py"
      - "analysis/44_recovery_stability_legacy.py"
      - "results/recovery_stability_legacy_v1_contract.json"
      - ".github/workflows/recovery-stability-legacy.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/44_recovery_stability_legacy.py"
      - "results/recovery_stability_legacy_v1_contract.json"
      - ".github/workflows/recovery-stability-legacy.yml"
  workflow_dispatch:

jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild exact-point community state
        run: python analysis/33_community_buffering.py --out results/generated_recovery_stability
      - name: Test recovery stability legacy
        run: python analysis/44_recovery_stability_legacy.py --input results/generated_recovery_stability --out results/generated_recovery_stability
      - name: Verify frozen recovered-sequence registry
        run: |
          python - <<'PY'
          import json
          x=json.load(open("results/generated_recovery_stability/recovery_stability_legacy_v1.json"))
          assert x["schema"]=="tampa.recovery_stability_legacy_v1.result"
          assert x["registry"]["recovered_four_year_sequences"]==83
          assert x["registry"]["recorded_relosses"]==30
          assert x["registry"]["stable_returns"]==53
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-recovery-stability-legacy-v1
          path: results/generated_recovery_stability/
