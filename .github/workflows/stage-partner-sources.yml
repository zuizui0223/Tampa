name: Stage and partner interaction source audit
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths:
      - 'analysis/154_stage_partner_sources.py'
      - '.github/workflows/stage-partner-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analysis/154_stage_partner_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-partner-sources
          path: stage_partner_sources/
          if-no-files-found: error
