name: Marine endozoochory public sources
on:
  push:
    branches: [analysis/reproductive-interaction-gates-20261124]
    paths: ['analysis/204_endozoochory_sources.py', '.github/workflows/endozoochory-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python analysis/204_endozoochory_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endozoochory-sources
          path: endozoochory_sources/
          retention-days: 14
