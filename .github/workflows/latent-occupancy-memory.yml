name: Latent occupancy detection memory known truth

on:
  push:
    branches: [mechanism/latent-occupancy-memory-v1]
    paths:
      - "analysis/20_latent_occupancy_detection_memory.py"
      - "results/latent_occupancy_detection_memory_v1_contract.json"
      - ".github/workflows/latent-occupancy-memory.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/20_latent_occupancy_detection_memory.py"
      - "results/latent_occupancy_detection_memory_v1_contract.json"
      - ".github/workflows/latent-occupancy-memory.yml"
  workflow_dispatch:

jobs:
  known-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python analysis/20_latent_occupancy_detection_memory.py --out results/generated_latent_occupancy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latent-occupancy-detection-memory
          path: results/generated_latent_occupancy/
