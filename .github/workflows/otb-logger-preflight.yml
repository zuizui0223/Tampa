name: OTB continuous logger source and alignment preflight

on:
  push:
    branches: [analysis/otb-logger-preflight-v1]
    paths:
      - "analysis/30_otb_logger_extract.R"
      - "analysis/31_otb_logger_preflight.py"
      - "analysis/32_otb_logger_lock_2026_predictor.R"
      - "results/otb_continuous_logger_preflight_v1_contract.json"
      - "results/otb_continuous_logger_preflight_v1.json"
      - "results/otb_logger_2026_primary_crosswalk_v1.csv"
      - "results/otb_logger_2027_condition_v1_contract.json"
      - ".github/workflows/otb-logger-preflight.yml"
  pull_request:
    branches: [main]
    paths:
      - "analysis/30_otb_logger_extract.R"
      - "analysis/31_otb_logger_preflight.py"
      - "analysis/32_otb_logger_lock_2026_predictor.R"
      - "results/otb_continuous_logger_preflight_v1_contract.json"
      - "results/otb_continuous_logger_preflight_v1.json"
      - "results/otb_logger_2026_primary_crosswalk_v1.csv"
      - "results/otb_logger_2027_condition_v1_contract.json"
      - ".github/workflows/otb-logger-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download pinned OTB logger snapshots and Tampa Event registry
        run: |
          mkdir -p results/generated_otb_logger
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/tbep-tech/otb-temp/5edb38a458b029cc52bcb8b326298d29bc4b1b2e/data/metadat.RData \
            -o results/generated_otb_logger/metadat.RData
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/tbep-tech/otb-temp/5edb38a458b029cc52bcb8b326298d29bc4b1b2e/data/tempdat.RData \
            -o results/generated_otb_logger/tempdat.RData
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/tbep-tech/obis-example/6c567beff95ea04f0e397101befb49d5233ace8f/dwc/event.csv \
            -o results/generated_otb_logger/event.csv
          test "$(git hash-object results/generated_otb_logger/metadat.RData)" = "248ebecfd0660d9a085bb106e587ecbe556b3a35"
          test "$(git hash-object results/generated_otb_logger/tempdat.RData)" = "1e1aed22a27a0a5531a4b6cd7af3238003b62f6d"
          test "$(git hash-object results/generated_otb_logger/event.csv)" = "583b4d4e328290ab065346579eb4f29f03ea0f99"
      - name: Extract logger deployment metadata and sampling summaries
        run: Rscript analysis/30_otb_logger_extract.R results/generated_otb_logger/metadat.RData results/generated_otb_logger/tempdat.RData results/generated_otb_logger/logger_metadata.csv results/generated_otb_logger/logger_deployment_summary.csv
      - name: Audit temporal quality and fixed-transect alignment
        run: python analysis/31_otb_logger_preflight.py --metadata results/generated_otb_logger/logger_metadata.csv --deployments results/generated_otb_logger/logger_deployment_summary.csv --event results/generated_otb_logger/event.csv --out results/generated_otb_logger
      - name: Verify preflight decision
        run: python -c "import json; x=json.load(open('results/generated_otb_logger/otb_continuous_logger_preflight_v1.json')); assert x['status']=='preflight_pass', x"
      - name: Lock 2026 response-free thermal predictor vector
        run: Rscript analysis/32_otb_logger_lock_2026_predictor.R results/generated_otb_logger/tempdat.RData results/generated_otb_logger/otb_logger_deployment_crosswalk.csv results/generated_otb_logger/otb_logger_2026_deployment_heat_metrics.csv results/generated_otb_logger/otb_logger_2026_fixed_node_heat_predictor.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tampa-otb-continuous-logger-preflight-v1
          path: results/generated_otb_logger/
