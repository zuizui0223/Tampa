name: Seagrass flowering donor and external genetic gate
on:
  pull_request:
    paths:
      - 'analysis/143_enhalus_hypothetical_flowering_donor_gate.py'
      - 'analysis/144_external_seagrass_genetic_source_gate.py'
      - '.github/workflows/seagrass-flowering-donor-and-external-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  donor_sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install numpy==2.2.6 openpyxl==3.1.5
      - run: |
          python - <<'PY'
          import importlib.util
          s=importlib.util.spec_from_file_location("acquire","analysis/138_reproductive_exact_source_members.py")
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          v, members=m.SOURCES["yu"]
          print(m.extract("yu",v,members))
          PY
          mkdir -p out
          python analysis/143_enhalus_hypothetical_flowering_donor_gate.py > out/enhalus_donor_gate.json
          python - <<'PY'
          import json,math
          x=json.load(open("out/enhalus_donor_gate.json"))
          k="0.5|0.1|independent_ramets"
          for i,r in enumerate(("1","2","4","8")):
              assert len(x["B_minus_A"][r])==36
              assert all(v["ramet_weighted_probability"]>0 for v in x["B_minus_A"][r].values())
              for p,v in [("PLOTA",[.1029,.2801,.7042,.9719][i]),("PLOTB",[.1381,.3628,.8051,.9911][i])]:
                  assert math.isclose(x["plots"][p][r]["scenarios"][k]["ramet_weighted_probability"],v,abs_tol=.0001)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: enhalus-donor-sensitivity
          path: out/enhalus_donor_gate.json
          if-no-files-found: error
  external_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install openpyxl==3.1.5
      - run: python analysis/144_external_seagrass_genetic_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: external-seagrass-genetic-inventory
          path: external_reproductive/
          retention-days: 3
          if-no-files-found: error
